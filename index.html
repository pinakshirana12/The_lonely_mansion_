<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>The Lonely Mansion</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <h1>THE LONELY MANSION</h1>

        <p class="episode">
            EPISODE 1 — THE 555 SHORTCUT
        </p>

        <section id="story">

            <h2>Friday the 13th...</h2>

            <p>
                Lisna, Avi, Pinu and Berry are enjoying
                a party together.
            </p>

            <p>
                Later that night, they decide to go
                for a long drive.
            </p>

            <p>
                None of them know that this journey
                will change their lives forever.
            </p>

        </section>

        <section id="choices">

            <button onclick="startGame()">
                🚗 Start the Journey
            </button>

        </section>

        <p id="status"></p>

    </main>

    <script src="script.js"></script>

</body>
</html>
